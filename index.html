<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rabbit | Fully Autonomous AI Agent Go-To-Market Platform</title>
  <meta name="description" content="Rabbit - Self-operating GTM AI platform powered by 6 autonomous agents. Discovers ICPs, enriches leads, writes personalized sequences, handles objections, and optimizes ROI autonomously.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* =====================================================
       SUPABASE DESIGN SYSTEM — Rabbit GTM Platform
       ===================================================== */
    :root {
      /* Supabase Core Palette */
      --sb-bg:          #0f0f0f;
      --sb-bg-alt:      #171717;
      --sb-surface:     #1c1c1c;
      --sb-surface-2:   #242424;
      --sb-surface-3:   #2a2a2a;
      --sb-border:      rgba(255,255,255,0.08);
      --sb-border-2:    rgba(255,255,255,0.12);

      /* Supabase Brand Green */
      --sb-green:       #3ECF8E;
      --sb-green-dark:  #2bba7e;
      --sb-green-dim:   rgba(62,207,142,0.12);
      --sb-green-glow:  rgba(62,207,142,0.25);
      --sb-green-border:rgba(62,207,142,0.3);

      /* Secondary Accents */
      --sb-blue:        #6366F1;
      --sb-blue-dim:    rgba(99,102,241,0.12);
      --sb-teal:        #0EA5E9;
      --sb-amber:       #F59E0B;
      --sb-amber-dim:   rgba(245,158,11,0.12);
      --sb-red:         #EF4444;
      --sb-purple:      #A855F7;
      --sb-purple-dim:  rgba(168,85,247,0.12);

      /* Typography */
      --sb-text:        #EDEDED;
      --sb-text-2:      #A0A0A0;
      --sb-text-3:      #666;

      /* Type */
      --font:     'Inter', system-ui, -apple-system, sans-serif;
      --font-mono:'Inter', sans-serif;

      /* Geometry */
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-full: 9999px;

      /* Shadows */
      --shadow-sm:    0 1px 2px rgba(0,0,0,0.5);
      --shadow-md:    0 4px 12px rgba(0,0,0,0.4);
      --shadow-green: 0 0 20px rgba(62,207,142,0.15);
      --shadow-glow:  0 0 40px rgba(62,207,142,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--sb-bg);
      color: var(--sb-text);
      line-height: 1.5;
      overflow-x: hidden;
      min-height: 100vh;
      font-size: 14px;
      /* Supabase-style subtle grid */
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px),
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(62,207,142,0.06), transparent);
      background-size: 40px 40px, 40px 40px, cover;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--sb-bg); }
    ::-webkit-scrollbar-thumb { background: var(--sb-surface-3); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--sb-green); }

    /* ---- LAYOUT ---- */
    .app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ---- HEADER ---- */
    .header {
      height: 60px;
      background: rgba(15,15,15,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--sb-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 50;
      flex-shrink: 0;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo {
      width: 32px; height: 32px;
      background: var(--sb-green);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      box-shadow: 0 0 12px var(--sb-green-glow);
    }
    .brand-name {
      font-size: 1rem; font-weight: 700; color: var(--sb-text);
      letter-spacing: -0.02em;
    }
    .brand-chip {
      font-size:14px; font-weight: 600;
      padding: 2px 8px;
      background: var(--sb-green-dim);
      color: var(--sb-green);
      border: 1px solid var(--sb-green-border);
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .header-center { display: flex; align-items: center; gap: 12px; }
    .status-pill {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 14px;
      background: var(--sb-surface);
      border: 1px solid var(--sb-border-2);
      border-radius: var(--radius-full);
    }
    .pulse-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--sb-green);
      box-shadow: 0 0 8px var(--sb-green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(62,207,142,0.7); }
      70%  { transform: scale(1);    box-shadow: 0 0 0 8px rgba(62,207,142,0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(62,207,142,0); }
    }

    .header-actions { display: flex; align-items: center; gap: 8px; }

    /* ---- BUTTONS ---- */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      font-family: var(--font); font-size:14px; font-weight: 500;
      border-radius: var(--radius-md);
      cursor: pointer; border: none; outline: none;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn-default {
      background: var(--sb-surface-2);
      color: var(--sb-text);
      border: 1px solid var(--sb-border-2);
    }
    .btn-default:hover { background: var(--sb-surface-3); border-color: rgba(255,255,255,0.18); }

    .btn-primary {
      background: var(--sb-green);
      color: #0f0f0f;
      font-weight: 600;
    }
    .btn-primary:hover { background: var(--sb-green-dark); box-shadow: var(--shadow-green); }

    .btn-outline {
      background: transparent;
      color: var(--sb-green);
      border: 1px solid var(--sb-green-border);
    }
    .btn-outline:hover { background: var(--sb-green-dim); }

    /* ---- SIDEBAR ---- */
    .body { display: flex; flex: 1; overflow: hidden; }
    .sidebar {
      width: 220px;
      background: var(--sb-bg-alt);
      border-right: 1px solid var(--sb-border);
      padding: 16px 8px;
      display: flex; flex-direction: column; gap: 2px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar-section {
      font-size:14px; font-weight: 600;
      color: var(--sb-text-3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 8px 10px 4px;
    }
    .nav-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      color: var(--sb-text-2); font-size:14px; font-weight: 400;
      cursor: pointer; border: none; background: none;
      width: 100%; text-align: left;
      transition: all 0.15s;
    }
    .nav-btn:hover { color: var(--sb-text); background: rgba(255,255,255,0.04); }
    .nav-btn.active {
      color: var(--sb-green); background: var(--sb-green-dim);
      font-weight: 500;
    }
    .nav-icon { font-size: 1rem; width: 18px; text-align: center; }
    .nav-badge {
      margin-left: auto; font-size:14px; font-weight: 600;
      padding: 1px 6px; border-radius: var(--radius-full);
      background: var(--sb-surface-3); color: var(--sb-text-2);
    }
    .nav-badge.green { background: var(--sb-green-dim); color: var(--sb-green); }

    .sidebar-footer {
      margin-top: auto; padding: 12px;
      background: var(--sb-green-dim);
      border: 1px solid var(--sb-green-border);
      border-radius: var(--radius-lg);
    }

    /* ---- MAIN CONTENT ---- */
    .main { flex: 1; overflow-y: auto; padding: 24px; }
    .view { display: none; animation: fadeIn 0.2s ease; }
    .view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .page-header { margin-bottom: 24px; }
    .page-title { font-size: 1.3rem; font-weight: 700; color: var(--sb-text); margin-bottom: 4px; letter-spacing: -0.02em; }
    .page-sub { font-size:14px; color: var(--sb-text-2); }

    /* ---- GRID ---- */
    .grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 14px; }

    /* ---- CARDS ---- */
    .card {
      background: var(--sb-surface);
      border: 1px solid var(--sb-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--sb-border-2); }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .card-title { font-size: 0.9rem; font-weight: 600; color: var(--sb-text); display: flex; align-items: center; gap: 8px; }
    .card-sub { font-size:14px; color: var(--sb-text-2); }

    /* ---- STAT CARDS ---- */
    .stat-card {
      background: var(--sb-surface);
      border: 1px solid var(--sb-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex; align-items: center; gap: 14px;
    }
    .stat-icon {
      width: 42px; height: 42px;
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .stat-val { font-size: 1.5rem; font-weight: 700; color: var(--sb-text); letter-spacing: -0.02em; }
    .stat-label { font-size:14px; color: var(--sb-text-2); margin-bottom: 2px; }
    .stat-trend { font-size:14px; font-weight: 500; color: var(--sb-green); }

    /* ---- BADGES / CHIPS ---- */
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      font-size:14px; font-weight: 500;
      padding: 2px 8px; border-radius: var(--radius-full);
    }
    .chip-green  { background: var(--sb-green-dim);  color: var(--sb-green);  border: 1px solid var(--sb-green-border); }
    .chip-amber  { background: var(--sb-amber-dim);  color: var(--sb-amber);  border: 1px solid rgba(245,158,11,0.3); }
    .chip-purple { background: var(--sb-purple-dim); color: var(--sb-purple); border: 1px solid rgba(168,85,247,0.3); }
    .chip-blue   { background: var(--sb-blue-dim);   color: #818CF8;          border: 1px solid rgba(99,102,241,0.3); }
    .chip-red    { background: rgba(239,68,68,0.12); color: var(--sb-red);    border: 1px solid rgba(239,68,68,0.3); }
    .chip-muted  { background: var(--sb-surface-2);  color: var(--sb-text-2); border: 1px solid var(--sb-border-2); }

    /* ---- AGENT CARDS ---- */
    .agent-card { position: relative; overflow: hidden; }
    .agent-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: var(--ac, var(--sb-green));
      opacity: 0.8;
    }
    .agent-avatar {
      width: 40px; height: 40px;
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      border: 1px solid var(--sb-border-2);
      flex-shrink: 0;
    }
    .agent-task {
      background: var(--sb-bg);
      border: 1px solid var(--sb-border);
      border-left: 2px solid var(--ac, var(--sb-green));
      border-radius: var(--radius-md);
      padding: 8px 10px;
      font-family: var(--font); font-size:14px;
      color: var(--sb-text-2);
      margin: 8px 0; min-height: 40px;
    }
    .agent-thought {
      font-size:14px; color: var(--sb-green);
      font-style: italic; margin-bottom: 10px;
      line-height: 1.5;
    }
    .agent-footer {
      display: flex; justify-content: space-between;
      font-size:14px; color: var(--sb-text-3);
      border-top: 1px solid var(--sb-border);
      padding-top: 8px;
    }

    /* ---- SVG GRAPH ---- */
    .graph-svg { width: 100%; height: 240px; }

    /* ---- LOG STREAM ---- */
    .log-stream {
      height: 240px; overflow-y: auto;
      font-family: var(--font); font-size:14px;
      display: flex; flex-direction: column; gap: 4px;
      padding: 10px;
      background: var(--sb-bg);
      border: 1px solid var(--sb-border);
      border-radius: var(--radius-md);
    }
    .log-entry {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.02);
      border-left: 2px solid var(--lc, var(--sb-green));
      animation: fadeIn 0.2s ease;
    }
    .log-time  { color: var(--sb-text-3); white-space: nowrap; font-size:14px; }
    .log-agent { color: var(--lc, var(--sb-green)); font-weight: 600; white-space: nowrap; }
    .log-text  { color: var(--sb-text-2); flex: 1; }

    /* ---- KANBAN ---- */
    .kanban { display: grid; grid-template-columns: repeat(5, minmax(180px,1fr)); gap: 12px; overflow-x: auto; padding-bottom: 10px; }
    .kanban-col {
      background: var(--sb-surface);
      border: 1px solid var(--sb-border);
      border-radius: var(--radius-lg);
      padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .kanban-header {
      display: flex; align-items: center; justify-content: space-between;
      font-size:14px; font-weight: 600;
      color: var(--sb-text-2);
      text-transform: uppercase; letter-spacing: 0.06em;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--sb-border);
    }
    .lead-card {
      background: var(--sb-bg-alt);
      border: 1px solid var(--sb-border);
      border-radius: var(--radius-md);
      padding: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .lead-card:hover { border-color: var(--sb-green-border); box-shadow: var(--shadow-green); transform: translateY(-1px); }
    .empty-col {
      text-align: center; padding: 20px 0;
      font-size:14px; color: var(--sb-text-3);
      border: 1px dashed var(--sb-border);
      border-radius: var(--radius-md);
    }

    /* ---- MODAL / DRAWER ---- */
    .backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s;
    }
    .backdrop.hidden { opacity: 0; pointer-events: none; }

    .drawer {
      position: fixed; right: 0; top: 0; bottom: 0;
      width: 500px;
      background: var(--sb-bg-alt);
      border-left: 1px solid var(--sb-border);
      padding: 24px;
      overflow-y: auto;
      animation: slideIn 0.25s ease;
    }
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

    .modal-box {
      width: 560px; max-width: 92vw;
      background: var(--sb-surface);
      border: 1px solid var(--sb-border-2);
      border-radius: var(--radius-xl);
      padding: 24px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6), var(--shadow-green);
    }

    /* ---- TABLE ---- */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th {
      font-size:14px; font-weight: 600;
      color: var(--sb-text-3); text-transform: uppercase; letter-spacing: 0.06em;
      padding: 10px 12px;
      border-bottom: 1px solid var(--sb-border);
      text-align: left;
    }
    .data-table td { padding: 11px 12px; border-bottom: 1px solid var(--sb-border); vertical-align: middle; }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: rgba(255,255,255,0.02); }

    /* ---- PROGRESS ---- */
    .progress-track { height: 6px; background: var(--sb-surface-3); border-radius: 3px; overflow: hidden; }
    .progress-fill  { height: 100%; border-radius: 3px; }

    /* ---- INPUTS ---- */
    input, textarea {
      font-family: var(--font); font-size:14px;
      background: var(--sb-bg);
      border: 1px solid var(--sb-border-2);
      border-radius: var(--radius-md);
      color: var(--sb-text);
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus { border-color: var(--sb-green); box-shadow: 0 0 0 2px rgba(62,207,142,0.12); }
    input::placeholder, textarea::placeholder { color: var(--sb-text-3); }

    /* ---- DIVIDER ---- */
    .divider { height: 1px; background: var(--sb-border); margin: 16px 0; }

    /* ---- RESPONSIVE ---- */
    @media (max-width: 1024px) { .grid-4 { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 900px)  { .grid-3 { grid-template-columns: 1fr; } .grid-2 { grid-template-columns: 1fr; } .sidebar { width: 180px; } }
    @media (max-width: 640px)  { .grid-4 { grid-template-columns: 1fr; } .sidebar { width: 160px; } .main { padding: 14px; } .brand-chip { display: none; } }
  </style>
</head>

</div>

</div>

function renderGraph() {

    { x:500, y:110, c:'#3ECF8E', e:'🧠', l:'Apex' }
  ];
  const edges = [[0,1],[0,2],[1,3],[2,3],[3,4],[4,5],[1,5]];
  const lines = edges.map(([a,b]) => {
    const na = nodes[a], nb = nodes[b];
    return `<line x1="${na.x}" y1="${na.y}" x2="${nb.x}" y2="${nb.y}" stroke="rgba(62,207,142,0.2)" stroke-width="1.5" stroke-dasharray="4,3"/>`;
  }).join('');
  const circles = nodes.map(n => `
    <g>
      <circle cx="${n.x}" cy="${n.y}" r="22" fill="${n.c}10" stroke="${n.c}" stroke-width="1.5"/>
      <circle cx="${n.x}" cy="${n.y}" r="28" fill="${n.c}05" stroke="${n.c}" stroke-width="8" stroke-opacity="0.08"/>

  svg.innerHTML = lines + circles;
}

function tick() {
  if (!state.engineRunning || !state.connectedDomain) return;

  const d = state.connectedDomain;
  const brandName = d.split('.')[0].charAt(0).toUpperCase() + d.split('.')[0].slice(1);

    { id:'apex',  name:'Apex',  c:'#3ECF8E', task:`Evaluating campaign ROI for ${brandName}...`, thought:`Doubling down on high-converting vertical; pausing low-fit segments.`, log:`Apex reallocated campaign budget to top-performing segment.` }
  ];

  const sc = scenarios[simIdx % scenarios.length];
  simIdx++;

  const a = state.agents.find(ag => ag.id === sc.id);
  if (a) { a.currentTask = sc.task; a.thoughtStream = sc.thought; a.actionsToday += Math.floor(Math.random()*3)+1; }
  addLog(sc.id, sc.name, sc.c, sc.log);

  if (sc.id === 'nova' && Math.random() > 0.4) {
    const i = Math.floor(Math.random()*SIM_NAMES.length);
    const name = SIM_NAMES[i], co = SIM_COS[i];
    state.leads.unshift({
      id:'sim-'+Date.now(), name, title:'VP of Growth', company:co,
      stage:'discovered', intentScore:80+Math.floor(Math.random()*18),
      email:name.toLowerCase().replace(' ','.')+('@'+co.toLowerCase().replace(/\s/g,'')+'.com'),
      phone:'+1 (415) '+Math.floor(200+Math.random()*799)+'-'+Math.floor(1000+Math.random()*8999),
      buyingSignals:[`Evaluating ${brandName}`, 'Active hiring spree'],
      lastActivity:`Discovered by Nova for ${brandName}`,
      history:[{time:'Just now', text:`Nova indexed profile matching ${brandName} ICP.`}]
    });
    renderSidebar();
  }

  if (sc.id === 'echo' && Math.random() > 0.5) {
    const order = ['discovered','contacted','engaged','meeting_booked','closed'];
    const prog = state.leads.filter(l => l.stage !== 'closed');
    if (prog.length) {
      const target = prog[Math.floor(Math.random()*prog.length)];
      const idx = order.indexOf(target.stage);
      if (idx > -1 && idx < order.length-1) {
        target.stage = order[idx+1];
        target.lastActivity = `Advanced to "${target.stage}" by Echo Agent`;
        if (!target.history) target.history = [];
        target.history.unshift({time:'Just now', text:`Echo advanced lead to "${target.stage}".`});
      }
    }
  }

  if (state.activeView === 'command-center') { renderAgents(); renderLogs(); }
  else if (state.activeView === 'pipeline') { renderPipeline(); }
}

function addLog(agentId, agentName, color, text) {
  const time = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  state.logs.unshift({id:'l'+Date.now(), time, agentId, agentName, color, text});
  if (state.logs.length > 60) state.logs.pop();
  if (state.activeView === 'command-center') renderLogs();
}

function renderGraph() {
  const svg = document.getElementById('graph-svg');
  if (!svg) return;
  const nodes = [
    { x:70,  y:110, c:'#3ECF8E', e:'🔍', l:'Koda' },
    { x:175, y:50,  c:'#6366F1', e:'📊', l:'Atlas' },
    { x:175, y:170, c:'#0EA5E9', e:'🎯', l:'Nova' },
    { x:290, y:80,  c:'#A855F7', e:'✍', l:'Pulse' },
    { x:400, y:110, c:'#F59E0B', e:'💬', l:'Echo' },
    { x:500, y:110, c:'#3ECF8E', e:'🧠', l:'Apex' }
  ];
  const edges = [[0,1],[0,2],[1,3],[2,3],[3,4],[4,5],[1,5]];
  const lines = edges.map(([a,b]) => {
    const na = nodes[a], nb = nodes[b];
    return `<line x1="${na.x}" y1="${na.y}" x2="${nb.x}" y2="${nb.y}" stroke="rgba(62,207,142,0.2)" stroke-width="1.5" stroke-dasharray="4,3"/>`;
  }).join('');
  const circles = nodes.map(n => `
    <g>
      <circle cx="${n.x}" cy="${n.y}" r="22" fill="${n.c}10" stroke="${n.c}" stroke-width="1.5"/>
      <circle cx="${n.x}" cy="${n.y}" r="28" fill="${n.c}05" stroke="${n.c}" stroke-width="8" stroke-opacity="0.08"/>
      <text x="${n.x}" y="${n.y + 5}" text-anchor="middle" font-size="13">${n.e}</text>
      <text x="${n.x}" y="${n.y + 38}" text-anchor="middle" font-size="9" fill="${n.c}" font-family="Inter,sans-serif" font-weight="600">${n.l}</text>
    </g>`).join('');
  svg.innerHTML = lines + circles;
}

    { id:'apex',  name:'Apex',  c:'#3ECF8E', task:`Evaluating campaign ROI for ${brandName}...`, thought:`Doubling down on high-converting vertical; pausing low-fit segments.`, log:`Apex reallocated campaign budget to top-performing segment.` }
  ];

  const sc = scenarios[simIdx % scenarios.length];
  simIdx++;

  const a = state.agents.find(ag => ag.id === sc.id);
  if (a) { a.currentTask = sc.task; a.thoughtStream = sc.thought; a.actionsToday += Math.floor(Math.random()*3)+1; }
  addLog(sc.id, sc.name, sc.c, sc.log);

  if (sc.id === 'nova' && Math.random() > 0.4) {
    const i = Math.floor(Math.random()*SIM_NAMES.length);
    const name = SIM_NAMES[i], co = SIM_COS[i];
    state.leads.unshift({
      id:'sim-'+Date.now(), name, title:'VP of Growth', company:co,
      stage:'discovered', intentScore:80+Math.floor(Math.random()*18),
      email:name.toLowerCase().replace(' ','.')+('@'+co.toLowerCase().replace(/\s/g,'')+'.com'),
      phone:'+1 (415) '+Math.floor(200+Math.random()*799)+'-'+Math.floor(1000+Math.random()*8999),
      buyingSignals:[`Evaluating ${brandName}`, 'Active hiring spree'],
      lastActivity:`Discovered by Nova for ${brandName}`,
      history:[{time:'Just now', text:`Nova indexed profile matching ${brandName} ICP.`}]
    });
    renderSidebar();
  }

  if (sc.id === 'echo' && Math.random() > 0.5) {
    const order = ['discovered','contacted','engaged','meeting_booked','closed'];
    const prog = state.leads.filter(l => l.stage !== 'closed');
    if (prog.length) {
      const target = prog[Math.floor(Math.random()*prog.length)];
      const idx = order.indexOf(target.stage);
      if (idx > -1 && idx < order.length-1) {
        target.stage = order[idx+1];
        target.lastActivity = `Advanced to "${target.stage}" by Echo Agent`;
        if (!target.history) target.history = [];
        target.history.unshift({time:'Just now', text:`Echo advanced lead to "${target.stage}".`});
      }
    }
  }

  if (state.activeView === 'command-center') { renderAgents(); renderLogs(); }
  else if (state.activeView === 'pipeline') { renderPipeline(); }
}

function addLog(agentId, agentName, color, text) {
  const time = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  state.logs.unshift({id:'l'+Date.now(), time, agentId, agentName, color, text});
  if (state.logs.length > 60) state.logs.pop();
  if (state.activeView === 'command-center') renderLogs();
}

function startSim() { if (!simTimer) simTimer = setInterval(tick, 3000); }
function stopSim()  { if (simTimer) { clearInterval(simTimer); simTimer = null; } }
