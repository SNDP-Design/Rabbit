      --rose: #F43F5E;

function renderWorkflowGraph() {
  const svg = document.getElementById('workflow-svg');
  if (!svg) return;
  const nodes = [
    { id:'koda',  x:80,  y:120, color:'#06B6D4', label:'Koda',  emoji:'🔍' },
    { id:'atlas', x:190, y:60,  color:'#6366F1', label:'Atlas', emoji:'📊' },
    { id:'nova',  x:190, y:180, color:'#EC4899', label:'Nova',  emoji:'🎯' },
    { id:'pulse', x:310, y:80,  color:'#A855F7', label:'Pulse', emoji:'✍️' },
    { id:'echo',  x:420, y:120, color:'#F59E0B', label:'Echo',  emoji:'💬' },
    { id:'apex',  x:530, y:120, color:'#10B981', label:'Apex',  emoji:'🧠' }
  ];
  const edges = [
    ['koda','atlas'],['koda','nova'],['atlas','pulse'],['nova','pulse'],['pulse','echo'],['echo','apex'],['atlas','apex']
  ];
  const edgesHtml = edges.map(([a, b]) => {
    const na = nodes.find(n => n.id === a), nb = nodes.find(n => n.id === b);
    return `<line x1="${na.x}" y1="${na.y}" x2="${nb.x}" y2="${nb.y}" stroke="rgba(99,102,241,0.3)" stroke-width="1.5" stroke-dasharray="4,3"/>`;
  }).join('');
  const nodesHtml = nodes.map(n => `
    <g>
      <circle cx="${n.x}" cy="${n.y}" r="26" fill="${n.color}20" stroke="${n.color}" stroke-width="1.5"/>
      <circle cx="${n.x}" cy="${n.y}" r="26" fill="${n.color}08" stroke="${n.color}60" stroke-width="8"/>
      <text x="${n.x}" y="${n.y + 5}" text-anchor="middle" font-size="14">${n.emoji}</text>
      <text x="${n.x}" y="${n.y + 44}" text-anchor="middle" font-size="10" fill="${n.color}" font-family="Outfit,sans-serif" font-weight="700">${n.label}</text>
    </g>`).join('');
  svg.innerHTML = edgesHtml + nodesHtml;
}

function setPreset(idx) {
  const input = document.getElementById('copilot-input');

}

function submitCopilot() {
  const input = document.getElementById('copilot-input');
  const text = input ? input.value.trim() : '';
  if (text) {
    addLog('apex','Apex','#10B981',`DIRECTIVE RECEIVED: "${text.substring(0,60)}...". Updating strategies across all 6 agents.`);
    const apex = state.agents.find(a => a.id === 'apex');
    if (apex) apex.thoughtStream = `Re-calibrating targeting per user directive: "${text.substring(0,40)}..."`;
    closeCopilot();
  }
}

// ---- SIMULATION ENGINE ---------------------------------
const scenarios = [
  { agentId:'koda',  agentName:'Koda',  color:'#06B6D4', task:'Crawling target domain & studying competitor landscape...', thought:'Extracted product offering. 60-second setup complete.', log:'Koda finished studying target domain & synthesized core value proposition.' },
  { agentId:'atlas', agentName:'Atlas', color:'#6366F1', task:'Segmentation AI calculating ICP Fit Scores (Event Designers 92%)...', thought:'Identified highest conversion opportunity: Event Floral Studios at $1.69/lead.', log:'Atlas computed fit score 92% for Event Designers vertical.' },
  { agentId:'nova',  agentName:'Nova',  color:'#EC4899', task:'Querying 536M+ GPU cluster for verified decision makers...', thought:'Sourced email for Michelle Leo (Owner @ Michelle Leo Events). 100% verified.', log:'Nova sourced 12 verified CEO/Founder contacts from 536M+ database.' },
  { agentId:'pulse', agentName:'Pulse', color:'#A855F7', task:'Writing context-aware 1:1 personal emails for event designers...', thought:'Crafted note comparing silk box shipping vs wilting fresh florals under spotlights.', log:'Pulse generated personalized emails for 12 newly discovered prospects.' },
  { agentId:'echo',  agentName:'Echo',  color:'#F59E0B', task:'Analyzing inbound response: "Can you do Tuesday 2pm?"...', thought:'Matched prospect schedule & auto-dispatched calendar booking confirmation.', log:'Echo auto-booked demo for Tuesday 14:00 EST.' },
  { agentId:'apex',  agentName:'Apex',  color:'#10B981', task:'Evaluating vertical campaign ROI ($1.69/lead vs $6.33/lead)...', thought:'Doubling down on Event Designers; pausing low-performing Houses of Worship.', log:'Apex reallocated budget to top-performing Event Designers vertical.' }
];

const simNames = ['Camille Rose','Wole Fagbohun','Joe Purcell','Adejuwon Oyebanjo','Stuart Armley','Priya Nair'];
const simCompanies = ['LogSure Floral','PlotWeaver Events','Radar Decor','Passpoint Styling','Foodfluence Events','Bloom & Co'];

let simStep = 0, simTimer = null;

function tick() {
  if (!state.engineRunning) return;
  const sc = scenarios[simStep % scenarios.length];
  simStep++;
  const agent = state.agents.find(a => a.id === sc.agentId);
  if (agent) {
    agent.currentTask = sc.task;
    agent.thoughtStream = sc.thought;
    agent.actionsToday += Math.floor(Math.random() * 3) + 1;
  }
  addLog(sc.agentId, sc.agentName, sc.color, sc.log);

  // Nova: occasionally source a new lead
  if (sc.agentId === 'nova' && Math.random() > 0.4) {
    const i = Math.floor(Math.random() * simNames.length);
    const name = simNames[i], company = simCompanies[i];
    const email = name.toLowerCase().replace(' ','.') + '@' + company.toLowerCase().replace(/\s/g,'') + '.com';
    state.leads.unshift({
      id: 'sim-' + Date.now(), name, title:'Owner & Founder', company,
      stage:'discovered', intentScore: 80 + Math.floor(Math.random() * 18),
      email, phone: '+1 (415) ' + Math.floor(200+Math.random()*799) + '-' + Math.floor(1000+Math.random()*8999),
      buyingSignals:['Hiring Event Stylists','Full-scale installs'],
      lastActivity:'Discovered by Nova Agent via 536M+ GPU scan',
      history:[{time:'Just now', text:'Nova indexed profile matching Event Designers ICP.'}]
    });
    renderSidebar();
  }

  // Echo: advance a lead stage
  if (sc.agentId === 'echo' && Math.random() > 0.5) {
    const stageOrder = ['discovered','contacted','engaged','meeting_booked','closed'];
    const progressable = state.leads.filter(l => l.stage !== 'closed');
    if (progressable.length) {
      const target = progressable[Math.floor(Math.random() * progressable.length)];
      const idx = stageOrder.indexOf(target.stage);
      if (idx !== -1 && idx < stageOrder.length - 1) {
        target.stage = stageOrder[idx + 1];
        target.lastActivity = `Advanced to "${target.stage}" by Echo Agent`;
        if (!target.history) target.history = [];
        target.history.unshift({ time:'Just now', text:`Echo advanced pipeline status to "${target.stage}".` });
      }
    }
  }

  // Update visible UI
  if (state.activeView === 'command-center') {
    renderWorkforceGrid();
    renderLogStream();
  } else if (state.activeView === 'pipeline') {
    renderPipeline();
  }
}

function addLog(agentId, agentName, color, text) {
  const time = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  state.logs.unshift({ id:'l'+Date.now(), time, agentId, agentName, color, text });
  if (state.logs.length > 60) state.logs.pop();
  if (state.activeView === 'command-center') renderLogStream();
}

function startSimulation() {
  if (simTimer) return;
  simTimer = setInterval(tick, 3000);
}

function stopSimulation() {
  if (simTimer) { clearInterval(simTimer); simTimer = null; }
}

renderSidebar();
renderCurrentView();
startSimulation();
