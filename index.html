<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Rabbit is a local-first GTM planning workspace with six coordinated AI-agent stages and approval gates.">
  <title>Rabbit — GTM operating system</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="menu-button" id="menuButton" aria-label="Open navigation" aria-expanded="false">Menu</button>
      <a class="brand" href="#overview" data-view="overview"><span class="brand-mark" aria-hidden="true">R</span><span>Rabbit</span></a>
      <div class="top-status"><span class="status-dot"></span><span id="runStatus">Ready to plan</span></div>
      <button class="text-button" id="resetButton">Reset workspace</button>
    </header>
    <div class="app-frame">
      <aside class="sidebar" id="sidebar" aria-label="Workspace navigation">
        <p class="eyebrow">Your GTM workspace</p>
        <nav>
          <button class="nav-link active" data-view="overview">Command center</button>
          <button class="nav-link" data-view="mission">Mission</button>
          <button class="nav-link" data-view="accounts">Accounts</button>
          <button class="nav-link" data-view="assets">Content & assets</button>
          <button class="nav-link" data-view="approvals">Approvals <span id="approvalCount" class="count">0</span></button>
          <button class="nav-link" data-view="results">Results</button>
          <button class="nav-link" data-view="settings">Integrations & settings</button>
        </nav>
        <div class="sidebar-note"><strong>Local-first by design.</strong><br>Rabbit creates plans and drafts here. Sending, publishing, booking, and budget changes always require your approval.</div>
      </aside>
      <main class="main-content" id="mainContent" tabindex="-1"></main>
    </div>
  </div>
  <div class="modal-backdrop hidden" id="modalBackdrop" aria-hidden="true"><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section></div>
  <noscript><p class="noscript">Rabbit needs JavaScript to save your workspace and run its planning workflow.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
