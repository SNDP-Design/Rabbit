<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Rabbit is a local-first Company Intelligence workspace for evidence-led public website research and founder review.">
  <title>Rabbit — Company Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=3.0.2">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="menu-button" id="menuButton" aria-label="Open navigation" aria-expanded="false">Menu</button>
      <a class="brand" href="#overview" data-view="overview"><span class="brand-mark" aria-hidden="true">R</span><span>Rabbit</span></a>
      <div class="top-status"><span class="status-dot"></span><span id="runStatus">Company Intelligence ready</span></div>
      <button class="text-button" id="resetButton">Reset workspace</button>
    </header>
    <div class="app-frame">
      <aside class="sidebar" id="sidebar" aria-label="Workspace navigation">
        <p class="eyebrow">Your GTM workspace</p>
        <nav>
          <button class="nav-link active" data-view="overview">Overview</button>
          <button class="nav-link" data-view="understanding">What I understand</button>
          <button class="nav-link" data-view="evidence">Evidence</button>
          <button class="nav-link" data-view="review">Questions & review <span id="approvalCount" class="count">0</span></button>
          <button class="nav-link" data-view="memory">Memory</button>
          <button class="nav-link" data-view="activity">Activity</button>
          <button class="nav-link" data-view="settings">Settings</button>
        </nav>
        <div class="sidebar-note"><strong>Founder-controlled.</strong><br>Research uses only public pages in local mode. Your corrections stay in this browser.</div>
      </aside>
      <main class="main-content" id="mainContent" tabindex="-1"></main>
    </div>
  </div>
  <div class="modal-backdrop hidden" id="modalBackdrop" aria-hidden="true"><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section></div>
  <noscript><p class="noscript">Rabbit needs JavaScript to save your local company workspace and show research results.</p></noscript>
  <script type="module" src="js/app.js?v=3.0.2"></script>
</body>
</html>
